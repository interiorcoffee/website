eep:  #E2E0D5;  /* slightly deeper linen for hairlines/fills */\n  --ic-linen-soft:  #F3F2EC;  /* lifted linen for raised surfaces          */\n  --ic-ink-70:      rgba(28, 28, 28, 0.70); /* secondary text on linen     */\n  --ic-ink-50:      rgba(28, 28, 28, 0.50); /* muted / meta text           */\n  --ic-ink-30:      rgba(28, 28, 28, 0.30); /* disabled, faint hairlines   */\n  --ic-ink-12:      rgba(28, 28, 28, 0.12); /* borders on linen            */\n  --ic-ink-06:      rgba(28, 28, 28, 0.06); /* subtle fills / hover wash   */\n  --ic-paper-70:    rgba(236, 235, 227, 0.70); /* linen text on dark       */\n  --ic-paper-50:    rgba(236, 235, 227, 0.50);\n  --ic-paper-14:    rgba(236, 235, 227, 0.14); /* borders on dark          */\n\n  /* ============================================================\n     Semantic aliases — reference these in components, not raw hex\n     ============================================================ */\n\n  /* Surfaces */\n  --surface-page:    var(--ic-linen);      /* default app/page canvas       */\n  --surface-raised:  var(--ic-linen-soft); /* cards lifted off the page     */\n  --surface-card:    var(--ic-white);      /* clean content cards           */\n  --surface-inverse: var(--ic-off-black);  /* dark sections, footers, story */\n  --surface-coffee:  var(--ic-coffee);     /* feature / editorial blocks    */\n  --surface-olive:   var(--ic-olive);\n\n  /* Text */\n  --text-strong:   var(--ic-off-black);  /* headlines, primary copy         */\n  --text-body:     var(--ic-ink-70);     /* running body on linen           */\n  --text-muted:    var(--ic-ink-50);     /* meta, timestamps, captions      */\n  --text-faint:    var(--ic-ink-30);     /* disabled                        */\n  --text-on-dark:  var(--ic-linen);      /* copy on off-black / coffee      */\n  --text-on-dark-muted: var(--ic-paper-70);\n  --text-accent:   var(--ic-coffee);     /* warm emphasis, links            */\n\n  /* Lines & borders */\n  --border-hair:   var(--ic-ink-12);     /* default hairline on linen       */\n  --border-strong: var(--ic-off-black);  /* deliberate framing rule         */\n  --border-on-dark: var(--ic-paper-14);\n\n  /* Interaction washes */\n  --wash-hover:    var(--ic-ink-06);\n  --wash-press:    var(--ic-ink-12);\n\n  /* Brand utility */\n  --brand-ink:     var(--ic-off-black);\n  --brand-canvas:  var(--ic-linen);\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   interior coffee — Typography tokens\n   Display: CLASSICO, always BOLD + always lowercase, airy tracking.\n   Text:    DM Sans, quiet and legible.\n   ============================================================ */\n\n:root {\n  /* ---- Families ---- */\n  --font-display: \"Classico\", \"Times New Roman\", serif;\n  --font-sans: \"DM Sans\", -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif;\n\n  /* Aliases by role */\n  --font-heading: var(--font-display); /* wordmark, titles, hero lines    */\n  --font-body:    var(--font-sans);    /* sublines, body, captions, UI    */\n\n  /* ---- Type scale (rem, 16px base) ---- */\n  --text-2xs:  0.6875rem;  /* 11px — micro labels, legal                 */\n  --text-xs:   0.75rem;    /* 12px — captions, meta                      */\n  --text-sm:   0.875rem;   /* 14px — secondary UI, fine print            */\n  --text-base: 1rem;       /* 16px — body                                */\n  --text-md:   1.125rem;   /* 18px — lead body                           */\n  --text-lg:   1.375rem;   /* 22px — sublines, card titles               */\n  --text-xl:   1.75rem;    /* 28px — section titles                      */\n  --text-2xl:  2.5rem;     /* 40px — display                             */\n  --text-3xl:  3.5rem;     /* 56px — hero                                */\n  --text-4xl:  5rem;       /* 80px — statement / cover                   */\n\n  /* ---- Weights ---- */\n  --weight-light:   300;  /* DM Sans light — quiet captions             */\n  --weight-regular: 400;\n  --weight-medium:  500;  /* DM Sans UI emphasis                        */\n  --weight-semibold:600;\n  --weight-bold:    700;  /* Classico Bold / DM Sans bold               */\n\n  /* ---- Line heights ---- */\n  --leading-tight:  1.05;  /* display lines                             */\n  --leading-snug:   1.2;   /* titles                                    */\n  --leading-normal: 1.3;   /* body — DM Sans runs at 1.2–1.4            */\n  --leading-relaxed:1.4;   /* long-form reading (top of the body range) */\n\n  /* ---- Letter spacing ---- */\n  --tracking-display: -0.01em; /* Classico large — barely tightened     */\n  --tracking-normal:   0em;\n  --tracking-wide:     0.04em; /* DM Sans labels                        */\n  --tracking-caps:     0.18em; /* the rare uppercase eyebrow            */\n}\n\n/* ---- Reusable type roles ---- */\n.ic-display {\n  font-family: var(--font-display);\n  font-weight: var(--weight-bold); /* CLASSICO is always bold */\n  font-size: var(--text-4xl);\n  line-height: var(--leading-tight);\n  letter-spacing: var(--tracking-display);\n  text-transform: lowercase;\n  color: var(--text-strong);\n}\n.ic-title {\n  font-family: var(--font-display);\n  font-weight: var(--weight-bold); /* CLASSICO is always bold */\n  font-size: var(--text-2xl);\n  line-height: var(--leading-snug);\n  letter-spacing: var(--tracking-display);\n  text-transform: lowercase;\n  color: var(--text-strong);\n}\n.ic-subline {\n  font-family: var(--font-sans);\n  font-weight: var(--weight-regular);\n  font-size: var(--text-lg);\n  line-height: var(--leading-normal);\n  color: var(--text-body);\n}\n.ic-body {\n  font-family: var(--font-sans);\n  font-weight: var(--weight-regular);\n  font-size: var(--text-base);\n  line-height: var(--leading-relaxed);\n  color: var(--text-body);\n}\n.ic-caption {\n  font-family: var(--font-sans);\n  font-weight: var(--weight-medium);\n  font-size: var(--text-xs);\n  line-height: var(--leading-normal);\n  letter-sp ht: 700;\n  font-display: swap;\n  src: url(\"e1e6e620-8218-4606-af3b-f0079a8d1d91\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'DM Sans';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"43a9a85d-78a7-4495-a544-a3344e6b5e69\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* ============================================================\n   interior coffee — Color tokens\n   Linen & Off Black as the foundation. Coffee & Olive as\n   the warm, material-conscious accents. Restraint over variety.\n   ============================================================ */\n\n:root {\n  /* ---- Brand palette (raw) ---- */\n  --ic-off-black: #1C1C1C;   /* primary ink — \"off black\", never pure #000 */\n  --ic-olive:     #4E4E3D;   /* muted olive / sage — calm, earthy accent  */\n  --ic-coffee:    #492F27;   /* deep coffee brown — warmest accent         */\n  --ic-linen:     #ECEBE3;   /* linen — the default warm canvas            */\n  --ic-white:     #FFFFFF;   /* clean white — secondary surface, prints    */\n\n  /* ---- Tints & derived neutrals (kept inside the family) ---- */\n  --ic-linen-deep:  #E2E0D5;  /* slightly deeper linen for hairlines/fills */\n  --ic-linen-soft:  #F3F2EC;  /* lifted linen for raised surfaces          */\n  --ic-ink-70:      rgba(28, 28, 28, 0.70); /* secondary text on linen     */\n  --ic-ink-50:      rgba(28, 28, 28, 0.50); /* muted / meta text           */\n  --ic-ink-30:      rgba(28, 28, 28, 0.30); /* disabled, faint hairlines   */\n  --ic-ink-12:      rgba(28, 28, 28, 0.12); /* borders on linen            */\n  --ic-ink-06:      rgba(28, 28, 28, 0.06); /* subtle fills / hover wash   */\n  --ic-paper-70:    rgba(236, 235, 227, 0.70); /* linen text on dark       */\n  --ic-paper-50:    rgba(236, 235, 227, 0.50);\n  --ic-paper-14:    rgba(236, 235, 227, 0.14); /* borders on dark          */\n\n  /* ============================================================\n     Semantic aliases — reference these in components, not raw hex\n     ============================================================ */\n\n  /* Surfaces */\n  --surface-page:    var(--ic-linen);      /* default app/page canvas       */\n  --surface-raised:  var(--ic-linen-soft); /* cards lifted off the page     */\n  --surface-card:    var(--ic-white);      /* clean content cards           */\n  --surface-inverse: var(--ic-off-black);  /* dark sections, footers, story */\n  --surface-coffee:  var(--ic-coffee);     /* feature / editorial blocks    */\n  --surface-olive:   var(--ic-olive);\n\n  /* Text */\n  --text-strong:   var(--ic-off-black);  /* headlines, primary copy         */\n  --text-body:     var(--ic-ink-70);     /* running body on linen           */\n  --text-muted:    var(--ic-ink-50);     /* meta, timestamps, captions      */\n  --text-faint:    var(--ic-ink-30);     /* disabled                        */\n  --text-on-dark:  var(--ic-linen);      /* copy on off-black / coffee      */\n  --text-on-dark-muted: var(--ic-paper-70);\n  --text-accent:   var(--ic-coffee);     /* warm emphasis, links            */\n\n  /* Lines & borders */\n  --border-hair:   var(--ic-ink-12);     /* default hairline on linen       */\n  --border-strong: var(--ic-off-black);  /* deliberate framing rule         */\n  --border-on-dark: var(--ic-paper-14);\n\n  /* Interaction washes */\n  --wash-hover:    var(--ic-ink-06);\n  --wash-press:    var(--ic-ink-12);\n\n  /* Brand utility */\n  --brand-ink:     var(--ic-off-black);\n  --brand-canvas:  var(--ic-linen);\n}\n\n/* ============================================================\n   interior coffee — Typography tokens\n   Display: CLASSICO, always BOLD + always lowercase, airy tracking.\n   Text:    DM Sans, quiet and legible.\n   ============================================================ */\n\n:root {\n  /* ---- Families ---- */\n  --font-display: \"Classico\", \"Times New Roman\", serif;\n  --font-sans: \"DM Sans\", -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif;\n\n  /* Aliases by role */\n  --font-heading: var(--font-display); /* wordmark, titles, hero lines    */\n  --font-body:    var(--font-sans);    /* sublines, body, captions, UI    */\n\n  /* ---- Type scale (rem, 16px base) ---- */\n  --text-2xs:  0.6875rem;  /* 11px — micro labels, legal                 */\n  --text-xs:   0.75rem;    /* 12px — captions, meta                      */\n  --text-sm:   0.875rem;   /* 14px — secondary UI, fine print            */\n  --text-base: 1rem;       /* 16px — body                                */\n  --text-md:   1.125rem;   /* 18px — lead body                           */\n  --text-lg:   1.375rem;   /* 22px — sublines, card titles               */\n  --text-xl:   1.75rem;    /* 28px — section titles                      */\n  --text-2xl:  2.5rem;     /* 40px — display                             */\n  --text-3xl:  3.5rem;     /* 56px — hero                                */\n  --text-4xl:  5rem;       /* 80px — statement / cover                   */\n\n  /* ---- Weights ---- */\n  --weight-light:   300;  /* DM Sans light — quiet captions             */\n  --weight-regular: 400;\n  --weight-medium:  500;  /* DM Sans UI emphasis                        */\n  --weight-semibold:600;\n  --weight-bold:    700;  /* Classico Bold / DM Sans bold               */\n\n  /* ---- Line heights ---- */\n  --leading-tight:  1.05;  /* display lines                             */\n  --leading-snug:   1.2;   /* titles                                    */\n  --leading-normal: 1.3;   /* body — DM Sans runs at 1.2–1.4            */\n  --leading-relaxed:1.4;   /* long-form reading (top of the body range) */\n\n  /* ---- Letter spacing ---- */\n  --tracking-display: -0.01em; /* Classico large — barely tightened     */\n  --tracking-normal:   0em;\n  --tracking-wide:     0.04em; /* DM Sans labels                        */\n  --tracking-caps:     0.18em; /* the rare uppercase eyebrow            */\n}\n\n/* ---- Reusable type roles ---- */\n.ic-display {\n  font-family: var(--font-display);\n  font-weight: var(--weight-bold); /* CLASSICO is always bold */\n  font-size: var(--text-4xl);\n  line-height: var(--leading-tight);\n  letter-spacing: var(--tracking-display);\n  text-transform: lowercase;\n  color: var(--text-strong);\n}\n.ic-title {\n  font-family: var(--font-display);\n  font-weight: var(--weight-bold); /* CLASSICO is always bold */\n  font-size: var(--text-2xl);\n  line-height: var(--leading-snug);\n  letter-spacing: var(--tracking-display);\n  text-transform: lowercase;\n  color: var(--text-strong);\n}\n.ic-subline {\n  font-family: var(--font-sans);\n  font-weight: var(--weight-regular);\n  font-size: var(--text-lg);\n  line-height: var(--leading-normal);\n  color: var(--text-body);\n}\n.ic-body {\n  font-family: var(--font-sans);\n  font-weight: var(--weight-regular);\n  font-size: var(--text-base);\n  line-height: var(--leading-relaxed);\n  color: var(--text-body);\n}\n.ic-caption {\n  font-family: var(--font-sans);\n  font-weight: var(--weight-medium);\n  font-size: var(--text-xs);\n  line-height: var(--leading-normal);\n  letter-spacing: var(--tracking-wide);\n  color: var(--text-muted);\n}\n.ic-eyebrow {\n  font-family: var(--font-sans);\n  font-weight: var(--weight-medium);\n  font-size: var(--text-2xs);\n  line-height: 1;\n  letter-spacing: var(--tracking-caps);\n  text-transform: uppercase;\n  color: var(--text-muted);\n}\n\n/* ============================================================\n   interior coffee — Spacing, radii, shadows, motion\n   Generous whitespace. Soft, never harsh. Editorial calm.\n   ============================================================ */\n\n:root {\n  /* ---- Spacing scale (4px base grid) ---- */\n  --space-0:  0;\n  --space-1:  0.25rem;  /*  4px */\n  --space-2:  0.5rem;   /*  8px */\n  --space-3:  0.75rem;  /* 12px */\n  --space-4:  1rem;     /* 16px */\n  --space-5:  1.5rem;   /* 24px */\n  --space-6:  2rem;     /* 32px */\n  --space-7:  3rem;     /* 48px */\n  --space-8:  4rem;     /* 64px */\n  --space-9:  6rem;     /* 96px */\n  --space-10: 8rem;     /* 128px */\n\n  /* ---- Radii — soft, modest. The brand is calm, not bubbly. ---- */\n  --radius-none: 0;\n  --radius-sm:   4px;    /* chips, inputs              */\n  --radius-md:   8px;    /* buttons, small cards       */\n  --radius-lg:   14px;   /* cards, media               */\n  --radius-xl:   22px;   /* feature blocks             */\n  --radius-pill: 999px;  /* tags, avatars, pill button */\n  --radius-circle: 50%;\n\n  /* ---- Borders ---- */\n  --border-width: 1px;\n  --border-width-strong: 1.5px;\n\n  /* ---- Shadows — barely-there, warm, diffuse. No hard drops. ---- */\n  --shadow-none: none;\n  --shadow-xs: 0 1px 2px rgba(28, 28, 28, 0.04);\n  --shadow-sm: 0 2px 8px rgba(28, 28, 28, 0.05);\n  --shadow-md: 0 8px 28px rgba(28, 28, 28, 0.07);\n  --shadow-lg: 0 18px 48px rgba(28, 28, 28, 0.10);\n  /* Lifted media on linen — slightly warmer */\n  --shadow-media: 0 14px 40px rgba(73, 47, 39, 0.12);\n\n  /* ---- Layout ---- */\n  --container-sm: 560px;\n  --container-md: 760px;\n  --container-lg: 1080px;\n  --container-xl: 1280px;\n  --gutter: var(--space-5);\n\n  /* ---- Motion — slow, soft fades. Nothing bouncy. ---- */\n  --ease-soft: cubic-bezier(0.22, 0.61, 0.36, 1); /* @kind other */\n  --ease-inout: cubic-bezier(0.45, 0, 0.2, 1);      /* @kind other */\n  --dur-fast: 140ms;  /* @kind other */\n  --dur-base: 240ms;  /* @kind other */\n  --dur-slow: 420ms;  /* @kind other */\n  --transition-base: all var(--dur-base) var(--ease-soft);\n}\n\n/* =============================== le=\"font-family:var(--font-sans);font-size:13px;letter-spacing:0.1em;color:var(--ic-ink-30)\">01<\u002Fspan>\n      <h2 style=\"margin:0;font-family:var(--font-display);font-weight:700;font-size:clamp(26px,4vw,34px);line-height:1.1;letter-spacing:-0.01em;text-transform:lowercase;color:var(--ic-off-black)\"><sc-if value=\"{{ de }}\" hint-placeholder-val=\"{{ true }}\">branding &amp; positionierung<\u002Fsc-if><sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ false }}\">branding &amp; positioning<\u002Fsc-if><\u002Fh2><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:18px\">\n        <sc-if value=\"{{ de }}\" hint-placeholder-val=\"{{ true }}\"><p style=\"margin:0;font-family:var(--font-sans);font-size:17px;line-height:1.55;color:var(--ic-ink-70);text-wrap:pretty\">Bevor irgendwas gestaltet wird: Wofür stehst du, für wen, und warum sollte es jemanden interessieren. Ich schärfe die Positionierung, finde die Tonalität und übersetze sie in eine visuelle Sprache, die man wiedererkennt.<\u002Fp><\u002Fsc-if>\n        <sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"margin:0;font-family:var(--font-sans);font-size:17px;line-height:1.55;color:var(--ic-ink-70);text-wrap:pretty\">before anything gets designed: what you stand for, who for, and why anyone should care. i sharpen the positioning, find the tone of voice and translate it into a visual language people recognise.<\u002Fp><\u002Fsc-if>\n        <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n          <span style=\"display:inline-flex;padding:5px 13px;border:1px solid var(--ic-ink-12);border-radius:var(--radius-pill);font-family:var(--font-sans);font-size:12px;font-weight:500;text-transform:lowercase;color:var(--ic-ink-70)\">markenkern<\u002Fspan>\n          <span style=\"display:inline-flex;padding:5px 13px;border:1px solid var(--ic-ink-12);border-radius:var(--radius-pill);font-family:var(--font-sans);font-size:12px;font-weight:500;text-transform:lowercase;color:var(--ic-ink-70)\">zielgruppe<\u002Fspan>\n          <span style=\"display:inline-flex;padding:5px 13px;border:1px solid var(--ic-ink-12);border-radius:var(--radius-pill);font-family:var(--font-sans);font-size:12px;font-weight:500;text-transform:lowercase;color:var(--ic-ink-70)\">tonalität<\u002Fspan>\n          <span style=\"display:inline-flex;padding:5px 13px;border:1px solid var(--ic-ink-12);border-radius:var(--radius-pill);font-family:var(--font-sans);font-size:12px;font-weight:500;text-transform:lowercase;color:var(--ic-ink-70)\">moodboard<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:32px;padding:44px 0;border-top:1px solid var(--ic-ink-12);align-items:start\">\n      <div style=\"display:flex;gap:18px;align-items:baseline\"><span style=\"font-family:var(--font-sans);font-size:13px;letter-spacing:0.1em;color:var(--ic-ink-30)\">02<\u002Fspan>\n      <h2 style=\"margin:0;font-family:var(--font-display);font-weight:700;font-size:clamp(26px,4vw,34px);line-height:1.1;letter-spacing:-0.01em;text-transform:lowercase;color:var(--ic-off-black)\"><sc-if value=\"{{ de }}\" hint-placeholder-val=\"{{ true }}\">konzept &amp; kreation<\u002Fsc-if><sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ false }}\">concept &amp; creation<\u002Fsc-if><\u002Fh2><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:18px\">\n        <sc-if value=\"{{ de }}\" hint-placeholder-val=\"{{ true }}\"><p style=\"margin:0;font-family:var(--font-sans);font-size:17px;line-height:1.55;color:var(--ic-ink-70);text-wrap:pretty\">Kampagnen, Shootings, Formate. Ich denke von der Idee bis zur umsetzbaren Shotlist — inklusive dem, was danach kommt: wie die Bilder weiterleben, auf welchen Kanälen, in welcher Reihenfolge.<\u002Fp><\u002Fsc-if>\n        <sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"margin:0;font-family:var(--font-sans);font-size:17px;line-height:1.55;color:var(--ic-ink-70);text-wrap:pretty\">campaigns, shoots, formats. i think it through from the idea to a shot list you can actually work with — including what comes after: where the images live, on which channels, in what order.<\u002Fp><\u002Fsc-if>\n        <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n          <span style=\"display:inline-flex;padding:5px 13px;border:1px solid var(--ic-ink-12);border-radius:var(--radius-pill);font-family:var(--font-sans);font-size:12px;font-weight:500;text-transform:lowercase;color:var(--ic-ink-70)\">kampagnenidee<\u002Fspan>\n          <span style=\"display:inline-flex;padding:5px 13px;border:1px solid var(--ic-ink-12);border-radius:var(--radius-pill);font-family:var(--font-sans);font-size:12px;font-weight:500;text-transform:lowercase;color:var(--ic-ink-70)\">shooting-konzept<\u002Fspan>\n          <span style=\"display:inline-flex;padding:5px 13px;border:1px solid var(--ic-ink-12);border-radius:var(--radius-pill);font-family:var(--font-sans);font-size:12px;font-weight:500;text-transform:lowercase;color:var(--ic-ink-70)\">art direction<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:32px;padding:44px 0;border-top:1px solid var(--ic-ink-12);align-items:start\">\n      <div style=\"display:flex;gap:18px;align-items:baseline\"><span style=\"font-family:var(--font-sans);font-size:13px;letter-spacing:0.1em;color:var(--ic-ink-30)\">03<\u002Fspan>\n      <h2 style=\"margin:0;font-family:var(--font-display);font-weight:700;font-size:clamp(26px,4vw,34px);line-height:1.1;letter-spacing:-0.01em;text-transform:lowercase;color:var(--ic-off-black)\"><sc-if value=\"{{ de }}\" hint-placeholder-val=\"{{ true }}\">design &amp; text<\u002Fsc-if><sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ false }}\">design &amp; copy<\u002Fsc-if><\u002Fh2><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:18px\">\n        <sc-if value=\"{{ de }}\" hint-placeholder-val=\"{{ true }}\"><p style=\"margin:0;font-family:var(--font-sans);font-size:17px;line-height:1.55;color:var(--ic-ink-70);text-wrap:pretty\">Landingpages, Newsletter, Produktseiten, Printstücke. Bild und Wort kommen bei mir aus einer Hand — das ist der Grund, warum es am Ende zusammenpasst statt nur nebeneinander zu liegen.<\u002Fp><\u002Fsc-if>\n        <sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"margin:0;font-family:var(--font-sans);font-size:17px;line-height:1.55;color:var(--ic-ink-70);text-wrap:pretty\">landing pages, newsletters, product pages, print. image and words come from the same hand — which is why they end up fitting together instead of just sitting next to each other.<\u002Fp><\u002Fsc-if>\n        <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n          <span style=\"display:inline-flex;padding:5px 13px;border:1px solid var(--ic-ink-12);border-radius:var(--radius-pill);font-family:var(--font-sans);font-size:12px;font-weight:500;text-transform:lowercase;color:var(--ic-ink-70)\">landingpage<\u002Fspan>\n          <span style=\"display:inline-flex;padding:5px 13px;border:1px solid var(--ic-ink-12);border-radius:var(--radius-pill);font-family:var(--font-sans);font-size:12px;font-weight:500;text-transform:lowercase;color:var(--ic-ink-70)\">newsletter<\u002Fspan>\n          <span style=\"display:inline-flex;padding:5px 13px;border:1px solid var(--ic-ink-12);border-radius:var(--radius-pill);font-family:var(--font-sans);font-size:12px;font-weight:500;text-transform:lowercase;color:var(--ic-ink-70)\">copywriting<\u002Fspan>\n          <span style=\"display:inline-flex;padding:5px 13px;border:1px solid var(--ic-ink-12);border-radius:var(--radius-pill);font-family:var(--font-sans);font-size:12px;font-weight:500;text-transform:lowercase;color:var(--ic-ink-70)\">layout<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:32px;padding:44px 0;border-top:1px solid var(--ic-ink-12);border-bottom:1px solid var(--ic-ink-12);align-items:start\">\n      <div style=\"display:flex;gap:18px;align-items:baseline\"><span style=\"font-family:var(--font-sans);font-size:13px;letter-spacing:0.1em;color:var(--ic-ink-30)\">04<\u002Fspan>\n      <h2 style=\"margin:0;font-family:var(--font-display);font-weight:700;font-size:clamp(26px,4vw,34px);line-height:1.1;letter-spacing:-0.01em;text-transform:lowercase;color:var(--ic-off-black)\">social media &amp; content<\u002Fh2><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:18px\">\n        <sc-if value=\"{{ de }}\" hint-placeholder-val=\"{{ true }}\"><p style=\"margin:0;font-family:var(--font-sans);font-size:17px;line-height:1.55;color:var(--ic-ink-70);text-wrap:pretty\">Redaktionsplan, Produktion, Community. Ich weiß, wie Content aussieht, der im Feed nicht wie Werbung wirkt — weil ich mit interior coffee selbst jeden Tag welchen mache.<\u002Fp><\u002Fsc-if>\n        <sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"margin:0;font-family:var(--font-sans);font-size:17px;line-height:1.55;color:var(--ic-ink-70);text-wrap:pretty\">editorial planning, production, community. i know what content looks like when it doesn't read as an ad in the feed — because i make it every day for interior coffee.<\u002Fp><\u002Fsc-if>\n        <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n          <span style=\"display:inline-flex;padding:5px 13px;border:1px solid var(--ic-ink-12);border-radius:var(--radius-pill);font-family:var(--font-sans);font-size:12px;font-weight:500;text-transform:lowercase;color:var(--ic-ink-70)\">redaktionsplan<\u002Fspan>\n          <span style=\"display:inline-flex;padding:5px 13px;border:1px solid var(--ic-ink-12);border-radius:var(--radius-pill);font-family:var(--font-sans);font-size:12px;font-weight:500;text-transform:lowercase;color:var(--ic-ink-70)\">reels &amp; foto<\u002Fspan>\n          <span style=\"display:inline-flex;padding:5px 13px;border:1px solid var(--ic-ink-12);border-radius:var(--radius-pill);font-family:var(--font-sans);font-size:12px;font-weight:500;text-transform:lowercase;color:var(--ic-ink-70)\">community<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background:var(--ic-off-black);padding:96px clamp(20px,5vw,32px)\">\n    <div style=\"max-width:1280px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:48px;align-items:start\">\n      <div style=\"display:flex;flex-direction:column;gap:20px\">\n        <span style=\"font-family:var(--font-sans);font-size:11px;font-weight:500;letter-spacing:0.18em;text-transform:uppercase;color:var(--ic-paper-50)\"><sc-if value=\"{{ de }}\" hint-placeholder-val=\"{{ true }}\">orientierung<\u002Fsc-if><sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ false }}\">orientation<\u002Fsc-if><\u002Fspan>\n        <sc-if value=\"{{ de }}\" hint-placeholder-val=\"{{ true }}\"><h2 style=\"margin:0;font-family:var(--font-display);font-weight:700;font-size:clamp(29px,5vw,44px);line-height:1.1;letter-spacing:-0.01em;text-transform:lowercase;color:var(--ic-linen)\">was es kostet<\u002Fh2><\u002Fsc-if>\n        <sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ false }}\"><h2 style=\"margin:0;font-family:var(--font-display);font-weight:700;font-size:clamp(29px,5vw,44px);line-height:1.1;letter-spacing:-0.01em;text-transform:lowercase;color:var(--ic-linen)\">what it costs<\u002Fh2><\u002Fsc-if>\n        <sc-if value=\"{{ de }}\" hint-placeholder-val=\"{{ true }}\"><p style=\"margin:0;font-family:var(--font-sans);font-size:17px;line-height:1.55;color:var(--ic-paper-70);max-width:400px;text-wrap:pretty\">Richtwerte, damit du weißt, woran du bist. Jedes Projekt bekommt danach ein individuelles Angebot — nach Umfang, nicht nach Paket.<\u002Fp><\u002Fsc-if>\n r(--font-display);font-weight:700;font-size:clamp(20px,2.8vw,24px);letter-spacing:-0.01em;text-transform:lowercase;color:var(--ic-linen)\"><sc-if value=\"{{ de }}\" hint-placeholder-val=\"{{ true }}\">markenaufbau komplett<\u002Fsc-if><sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ false }}\">full brand build<\u002Fsc-if><\u002Fspan>\n          <span style=\"font-family:var(--font-sans);font-size:17px;color:var(--ic-paper-70);white-space:nowrap\">ab 3.500 €<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:32px;padding:26px 0;border-top:1px solid var(--ic-paper-14);border-bottom:1px solid var(--ic-paper-14)\">\n          <span style=\"font-family:var(--font-display);font-weight:700;font-size:clamp(20px,2.8vw,24px);letter-spacing:-0.01em;text-transform:lowercase;color:var(--ic-linen)\"><sc-if value=\"{{ de }}\" hint-placeholder-val=\"{{ true }}\">content-betreuung<\u002Fsc-if><sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ false }}\">ongoing content<\u002Fsc-if><\u002Fspan>\n          <span style=\"font-family:var(--font-sans);font-size:17px;color:var(--ic-paper-70);white-space:nowrap\">ab 1.500 € / <sc-if value=\"{{ de }}\" hint-placeholder-val=\"{{ true }}\">monat<\u002Fsc-if><sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ false }}\">month<\u002Fsc-if><\u002Fspan>\n        <\u002Fdiv>\n        <span style=\"margin-top:20px;font-family:var(--font-sans);font-size:13px;color:var(--ic-paper-50)\"><sc-if value=\"{{ de }}\" hint-placeholder-val=\"{{ true }}\">Alle Preise netto, zzgl. Produktionskosten.<\u002Fsc-if><sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ false }}\">all prices net, production costs not included.<\u002Fsc-if><\u002Fspan>\n        <a href=\"kontakt.html\" style=\"align-self:flex-start;margin-top:32px;display:inline-flex;align-items:center;padding:14px 26px;border-radius:var(--radius-md);background:var(--ic-linen);color:var(--ic-off-black);font-family:var(--font-sans);font-size:15px;font-weight:500;text-transform:lowercase;text-decoration:none\" style-hover=\"opacity:0.82\"><sc-if value=\"{{ de }}\" hint-placeholder-val=\"{{ true }}\">projekt anfragen<\u002Fsc-if><sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ false }}\">start a project<\u002Fsc-if><\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <dc-import name=\"_build_SiteFooter\" lang=\"{{ lang }}\" hint-size=\"100%,460px\"><\u002Fdc-import>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { lang: 'de' };\n  componentDidMount() {\n    try { const s = localStorage.getItem('ic-lang'); if (s) this.setState({ lang: s }); } catch (e) {}\n    this._h = (e) => this.setState({ lang: e.detail });\n    window.addEventListener('ic-lang', this._h);\n  }\n  componentWillUnmount() { window.removeEventListener('ic-lang', this._h); }\n  renderVals() {\n    const lang = this.state.lang;\n    return { lang, de: lang === 'de', en: lang === 'en' };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
